name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: >-
          node --test
          src/app/api/send/captcha.test.mjs
          src/app/api/send/contact-input.test.mjs
          src/app/components/analytics/consent.test.mjs

      - name: Lint
        run: npx --no-install eslint .

      - name: Build
        run: npm run build
